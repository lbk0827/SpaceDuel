<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Recoil Duel</title>
<style>
  html,body{margin:0;height:100%;background:#070a18;color:#eef;font:14px/1.4 system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #app{position:relative;aspect-ratio:16/9;width:100vw;max-height:100vh;max-width:calc(100vh*16/9);touch-action:none;user-select:none}
  #game{display:block;width:100%;height:100%;cursor:crosshair}
  #hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;gap:16px;align-items:center;pointer-events:none}
  .pill{background:#000a;border-radius:999px;padding:6px 14px;font-weight:700;backdrop-filter:blur(4px)}
  #scores{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  .pill.dead{opacity:.4;text-decoration:line-through}
  #banner button.secondary{background:#3a4a7a}
  #gaugeWrap{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:8px;pointer-events:none}
  .ring{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 3px #0008}
  .ring.ready{box-shadow:0 0 0 3px #3b9dff,0 0 14px #3b9dff88}
  .pips{display:flex;gap:4px}
  .pip{display:inline-block;width:12px;height:36px;border-radius:4px;box-shadow:0 0 0 2px #0008}
  #gaugeLabel{font-weight:700;color:#7dbdff;text-shadow:0 1px 2px #000}
  #banner[hidden],#panel[hidden]{display:none}
  #banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0006;pointer-events:none}
  #banner .card{background:#141b3aee;border-radius:16px;padding:22px 30px;text-align:center;min-width:220px;box-shadow:0 8px 40px #000a;pointer-events:auto}
  #banner h2{margin:0 0 6px;font-size:28px}
  #banner p{margin:0 0 12px;opacity:.85;font-size:18px}
  #banner button{padding:10px 18px;border:0;border-radius:10px;background:#3b9dff;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  #hint{position:absolute;bottom:12px;right:16px;opacity:.6;font-size:12px;pointer-events:none}
  #panel{position:fixed;top:8px;right:8px;width:270px;max-height:96vh;overflow:auto;background:#ffffffee;color:#123;border-radius:8px;padding:10px 12px;box-shadow:0 2px 12px #0006;font-size:12px}
  #panel label{display:block;margin:6px 0 2px}
  #panel input[type=range]{width:100%}
  #panel .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
  #panel button{margin-top:8px;width:100%;padding:6px}
</style>
<script type="importmap">
{
  "imports": {
    "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier2d-compat@0.14.0/rapier.es.js"
  }
}
</script>
</head>
<body>
  <div id="stage">
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud"><div id="scores"></div></div>
      <div id="gaugeWrap"><div id="gauge" class="ring"></div><span id="gaugeLabel"></span></div>
      <div id="banner" hidden><div class="card"><h2 id="bannerTitle"></h2><p id="bannerText"></p><div id="bannerBtns"></div></div></div>
      <div id="hint">클릭 = 총구 방향으로 발사 · 반동으로 이동 · ` 튠 패널 <span id="build">__BUILD__</span></div>
    </div>
  </div>
  <div id="panel" hidden></div>
  <!-- dev-only:start -->
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('bannerTitle').textContent = '이 파일은 개발용입니다';
      document.getElementById('bannerText').innerHTML = '더블클릭 실행은 <b>dist\\index.html</b><br>(없으면 <code>npm install &amp;&amp; npm run build</code>)';
      document.getElementById('banner').hidden = false;
    }
  </script>
  <!-- dev-only:end -->
  <script type="module" src="./src/game.js"></script>
</body>
</html>
